amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    # 'map' when AMCL is localizing on a static pre-built map (our Nav2
    # integration path). AMCL publishes map→odom TF in that case.
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Sprint 2 fix: enable AMCL kidnap recovery. With both alphas at 0.0
    # AMCL never injects random particles when likelihood drops, so once
    # the filter locks onto a confidently-wrong pose (observed empirically
    # 2026-05-06 door-probe: median_abs_error 0.28-0.58m while
    # converged=true) it cannot recover. Standard tuning per Nav2 docs.
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan

bt_navigator:
  ros__parameters:
    use_sim_time: False
    # Navigator plans + tracks in map frame (provided by AMCL via TF).
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    # 3.0 → 10.0 — at 3Hz cycle is 333ms; with WebRTC TF latency (200-700ms)
    # controller often reads stale TF. At 10Hz controller skips stale frames
    # rather than stalling on Extrapolation Error.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # RotationShimController wraps DWB — first rotates the robot in
    # place toward the path heading before handing off to the driving
    # controller. Quadrupeds like Go2 yaw freely but DWB alone tries to
    # drive + rotate simultaneously, which fails near doorways
    # (trajectory samples all collide with frame). The shim eliminates
    # that "stuck rotating and driving" failure mode. See
    # https://docs.nav2.org/configuration/packages/configuring-rotation-shim-controller.html
    # ULTRATHINK Plan B: DWB rejected ALL 251 trajectories on 12 successive
    # restarts despite tuning sim_time, vel limits, robot_radius, inflation,
    # voxel_layer enable/disable, and dual-map architecture. The 819→251
    # reduction confirmed our sample-count fixes were applied — but rejection
    # rate stayed 100%. Conclusion: sample-and-score model is structurally
    # incompatible with our environment (tight rooms + WebRTC TF jitter +
    # cleaned/raw map disagreement). Switching to RegulatedPurePursuit which
    # follows the global path strictly without trajectory sampling.
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # RotationShim wrapper — rotates to path heading first, then hands off
      # to RPP for path following.
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      # RPP params — agent-recommended for Go2 indoor:
      # Tuned to match DimOS/replanning_a_star/local_planner.py PController
      # which user verified DOES patrol Go2 between rooms (no Nav2 path).
      # Key: Go2 ignores cmd_vel < 0.2 m/s — must always send ≥ 0.2.
      # User test #16 worked (passed doorway!) but two issues:
      # (1) zigzag — rotate-then-drive switching too eager.
      # (2) clipped obstacles — onboard avoidance disabled, no fallback.
      # Fix #1: bigger lookahead + raise rotate-to-heading threshold so
      # RPP smooth-drives with angular correction instead of rotate-pause-drive.
      # Fix #2: lower max velocity so user can react / no Nav2 collision check
      # but Go2 firmware still has emergency-stop on contact (slower = safer).
      desired_linear_vel: 0.3                 # was 0.55, slower for safety
      lookahead_dist: 1.0                     # was 0.6 — bigger = smoother arc
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.4
      lookahead_time: 1.5
      transform_tolerance: 1.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.20      # Go2 floor — anything below stalls
      approach_velocity_scaling_dist: 0.6
      # Stays disabled. Test #18: even with rectangular footprint + inflation
      # 0.05, RPP vetos every doorway (~60cm) because /scan walls are within
      # 5cm of footprint edge. Test #16-17: with this off, robot physically
      # navigates and passes doorway. Real obstacle safety should be a
      # SEPARATE collision_monitor node (not coupled to path-following).
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      # Smooth drive instead of rotate-pause-drive. With this OFF, RPP applies
      # angular correction continuously while driving forward → no zigzag.
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 1.5        # 85° — only rotate-in-place if
                                              # heading is near-backward
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      # 5 Hz is the minimum for reactive obstacle avoidance — at 0.5 m/s the
      # robot advances 10 cm per update, acceptable reaction distance for
      # pedestrians / pets. 1 Hz was a dead-man's switch (50 cm lag).
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # B: Rectangular footprint instead of circle. Go2 is 30×65cm; circular
      # robot_radius=0.20 (=40cm circle) ignored orientation → controller
      # planned through 60cm doorway as if robot were 40cm circle. With
      # rectangle, costmap knows robot orientation: 17cm half-width on
      # short side fits 60cm doorway with 13cm each side clearance.
      # Format: [[+x,+y],[+x,-y],[-x,-y],[-x,+y]] in base_link frame.
      footprint: "[[0.33, 0.17], [0.33, -0.17], [-0.33, -0.17], [-0.33, 0.17]]"
      # ULTRATHINK fix #2: re-enable voxel_layer. Local needs runtime
      # obstacles for safety. Issue earlier was static_layer:/map_clean
      # mismatch (cleaned map had shifted walls vs AMCL pose) — fixed below
      # by pointing local static to /map (raw).
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # CRITICAL fix: local uses RAW map (/map). AMCL localizes against raw
        # map; controller's local costmap MUST agree with AMCL's mental model.
        # Earlier we used /map_clean which had shifted walls (expand_free)
        # → DWB simulating from AMCL pose saw lethal cells where there
        # shouldn't be → all 819 trajectories rejected. Keep local on raw /map
        # so live scan, AMCL, and static wall geometry all agree.
        map_topic: /map
        map_subscribe_transient_local: True

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        observation_sources: scan
        # Footprint area always clears to free — kills the "Starting point
        # in lethal space" class of errors at source. The robot can never
        # be "in a wall" from its own perspective.
        footprint_clearing_enabled: true
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          # CRITICAL: 0.25 m skip-zone around the lidar so Go2's own body
          # reflections (legs / head seen by the head-mounted sensor)
          # don't mark cells right under the footprint as obstacles.
          raytrace_min_range: 0.25
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Sprint 2 fix: 0.05 → 0.20. Inflation layer provides the soft cost
        # gradient that lets the controller naturally prefer center-of-corridor
        # without any custom logic. With 0.05 there was effectively no
        # gradient — controller had to make hard accept/reject decisions at
        # the wall edge, which the previous custom pure-pursuit hard-stopped
        # via "scan blocked" predicate. With MPPI controller (Sprint 2 Phase C)
        # the gradient drives soft trajectory deflection: ObstaclesCritic
        # samples thousands of trajectories and prefers low-cost ones, so a
        # ~0.20m inflation gives 7-tier exponential cost falloff.
        # 80cm door - 34cm footprint = 23cm clearance/side; 0.20m inflation
        # creates a gradient through that whole corridor space, peak at wall.
        cost_scaling_factor: 3.0
        inflation_radius: 0.20

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      # Global costmap lives in the map frame — static_layer subscribes
      # to /map from nav2_map_server. Requires AMCL publishing map→odom.
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      resolution: 0.05
      # Sprint 2 fix: False → True. Inconsistency with planner's
      # allow_unknown=true on line ~384 — costmap was treating NO_INFORMATION
      # as FREE (passable) while planner was told it could plan through
      # unknown. Now both layers agree: costmap distinguishes UNKNOWN
      # cells, planner is permitted to traverse them. Crucial near doorways
      # where /scan can produce small UNKNOWN patches at frame edges.
      track_unknown_space: True
      static_map: True
      width: 500
      height: 500
      origin_x: -250.0 
      origin_y: -250.0
      # Circle model instead of rectangle — a quadruped yaws freely about
      # base_link, so re-checking corners at every heading makes Nav2
      # brittle in doorways. 0.34 m ≈ half-diagonal of 0.30×0.65 footprint
      # minus a sliver (doorways are 75 cm so 2×0.34=0.68 leaves 3.5 cm
      # clearance each side — tight but passable).
      footprint: "[[0.33, 0.17], [0.33, -0.17], [-0.33, -0.17], [-0.33, 0.17]]"   # match local rectangular
      # Removed voxel_layer from global_costmap. Reasoning:
      # - global_costmap is for path PLANNING (long-horizon, static features).
      # - local_costmap (with voxel_layer + /scan) handles RUNTIME obstacle
      #   avoidance in a 6m rolling window — that's where dynamic obstacles
      #   matter for the controller.
      # - With voxel_layer in global, every /scan reading gets DOUBLE-marked
      #   (once via static_layer's transient_local map, once via voxel_layer's
      #   live scan), creating spurious lethal cells around the robot that
      #   blocked SmacPlanner2D from finding paths. Removing the duplication
      #   restored planning.
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # User test #19 conclusion: cleaned map's expand_free_into_unknown=0.30m
        # widened doorways BEYOND real wall positions. Planner planned path
        # through "fake" door spot, robot's /scan saw real walls there →
        # collision. Reverting global to raw /map (single-map): doorways are
        # at real positions, planner has accurate geometry. Trade-off: raw
        # map has speckle that may complicate planning, but real-wall
        # accuracy beats fake-door corridors.
        map_topic: /map
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Plan-only test 2026-05-04: with inflation_radius=0.05 and smoothing
        # enabled, Smac produced a nominally legal path with only 0.14 m raw-map
        # centerline clearance near (0.75, -1.26). Go2 half-width is ~0.17 m,
        # so that plan physically scrapes walls. 0.22 m keeps a 5 cm margin
        # over half-width while still fitting through 70 cm doors when centered.
        cost_scaling_factor: 2.0
        inflation_radius: 0.22

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    # Real robot, no /clock publisher — planner must use wall clock or it
    # stalls forever waiting for ticks that never arrive.
    use_sim_time: False

    GridBased:
      # SmacPlanner2D: pure grid A*, ignores kinematic constraints.
      # The previous SmacPlannerHybrid with motion_model=REEDS_SHEPP was
      # designed for Ackermann-style cars that cannot turn in place —
      # combined with minimum_turning_radius=0.30m it refused to produce
      # plans in our ~75 cm indoor doorways, leaving bt_navigator stuck
      # in "spin as recovery" loops. Go2 is a quadruped that rotates
      # freely about base_link, so pure grid A* is both simpler and
      # strictly more permissive.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.3                            # reach goal within 30 cm — good enough for home navigation
      downsample_costmap: false
      downsampling_factor: 1
      # Allow planning through unknown space. Go2's voxel window is only
      # 6.4 m wide; any goal further than that sits in "unknown" from
      # our perspective, and we need the planner to route through it
      # rather than refuse.
      # Sprint 1B Test 2 (raw map bez auto-clean): raw mapy mają unknown
      # cells dokładnie przy framugach drzwi — bez allow_unknown=true planner
      # odmawia planowania ścieżki przez te przejścia. Default false → blocking.
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Treat inflated raw-map costs as important. Low values allowed shorter
      # routes that hugged walls; plan-only clearance gate requires >=0.22 m.
      cost_travel_multiplier: 8.0
      # Smac smoothing can cut corners after A*, reducing wall clearance. Keep
      # grid path geometry for the external pure-pursuit controller.
      smooth_path: False
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
    
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # Sprint 2 fix: re-enable controller_server, smoother_server,
    # velocity_smoother. Previously disabled because custom_controller.py
    # (DimOS pure-pursuit) replaced them — Sprint 2 swaps to Nav2 standard
    # MPPI Controller (configured in controller_server FollowPath section)
    # which works through narrow doorways out of the box per Macenski 2024.
    # With controller_server back in lifecycle, the standard Nav2 BT
    # recovery subtree (Spin / BackUp / ClearCostmap / Wait) finally works
    # because behavior_server has a controller to bond with.
    node_names: ["controller_server", "smoother_server", "planner_server", "behavior_server", "bt_navigator", "waypoint_follower", "velocity_smoother"]
    bond_timeout: 0.0

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    # Behaviors operate in map frame so recovery (backup, spin) reasons
    # about the localized pose, not raw odom (which drifts over a session).
    global_frame: map
    robot_base_frame: base_link
    # Bumped 0.1 → 1.5 (matches controller_server) — Go2 WebRTC TF latency.
    transform_tolerance: 1.5
    # Real robot, no /clock publisher — same story as planner_server above.
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
