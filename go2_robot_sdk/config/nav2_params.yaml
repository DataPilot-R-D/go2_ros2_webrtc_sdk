amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    # 'map' when AMCL is localizing on a static pre-built map (our Nav2
    # integration path). AMCL publishes map→odom TF in that case.
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # Sprint 2 fix: enable AMCL kidnap recovery. With both alphas at 0.0
    # AMCL never injects random particles when likelihood drops, so once
    # the filter locks onto a confidently-wrong pose (observed empirically
    # 2026-05-06 door-probe: median_abs_error 0.28-0.58m while
    # converged=true) it cannot recover. Standard tuning per Nav2 docs.
    #
    # TUNING NOTE (review #8): 0.1 is at AGGRESSIVE end of Nav2 examples
    # (0.05-0.1 typical). With WebRTC TF jitter, a single bad scan can
    # inject 10% random particles → may cause spurious kidnap-recovery
    # events. If Phase D shows AMCL twitchiness, try 0.05/0.001 as
    # conservative alternative.
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan
    # Sprint 2 Phase 0 (post-review): explicit operator-driven initial pose.
    # Operator sets via `ros2 topic pub --once /initialpose ...` from the
    # known door-probe start (1.975, -3.173). Setting set_initial_pose:false
    # avoids AMCL grabbing whatever is in initial_pose_{x,y,yaw} params at
    # boot — keeps run-to-run AMCL state reproducible across Phase D runs.
    set_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: False
    # Navigator plans + tracks in map frame (provided by AMCL via TF).
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
