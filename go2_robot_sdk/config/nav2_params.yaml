bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    # Sprint 2 Phase 1 Hetzner validation 2026-05-08 found that
    # controller_frequency: 30.0 + model_dt: 0.033 fails MPPI configure with
    # "Controller period more then model dt, set it equal to model dt" because
    # period = 1/30 = 0.0333... > model_dt = 0.033 (floating-point ε).
    # Fix: drop to Macenski standard 20Hz + model_dt 0.05 (1/20 = 0.05 exactly).
    # Empirical verification on cax11 cax11 ARM Hetzner Ubuntu 22.04 + Nav2
    # Humble 1.1.20: lifecycle CONFIGURE succeeded after this change.
    # Reactivity tradeoff: 20Hz vs 30Hz means 17ms longer reaction time
    # (50ms vs 33ms loop). For Go2 at 0.4 m/s this is 7mm vs 13mm of travel
    # per cycle — both fine for narrow corridor navigation.
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # Sprint 2 Phase C controller swap: RotationShim+RegulatedPurePursuit
    # → MPPI Controller (Model Predictive Path Integral).
    #
    # WHY MPPI:
    # - Industry standard 2026 for narrow-passage indoor navigation.
    #   Steve Macenski (Nav2 maintainer): MPPI is "successor to TEB and
    #   pure path tracking MPC controllers", released mainline Humble,
    #   45% faster in Jazzy via Eigen reimpl.
    # - Sampling-based (2000 trajectories/cycle) — soft trajectory
    #   correction via cost critics, no hard veto. Replaces our custom
    #   "scan blocked" hard-stop predicate with native MPPI ObstaclesCritic
    #   which gradually pushes trajectories away from walls.
    # - Plugin-architecture for critics — tuneable per-environment without
    #   code changes. Path/Obstacle/Goal critics auto-balance:
    #   PathAlignCritic disables itself when local path blocked, so
    #   ObstaclesCritic takes over for soft deflection.
    #
    # Previous attempts:
    # - DWB: rejected 251/251 trajectories in 12 successive runs (sampling
    #   model rejected by tight environment + WebRTC TF jitter)
    # - RPP: passed doorways once but couldn't react to obstacles (path-
    #   tracker, no avoidance) — required custom_controller.py veto layer
    # - custom_controller.py (DimOS pure-pursuit): worked once at 13:31
    #   on 2026-05-06, not repeatable; 506 lines of unmaintainable Python
    #
    # MPPI parameters tuned for Go2 narrow-passage from Nav2 docs +
    # community examples. KEY tuning rule per Macenski Tuning Guide:
    # ObstaclesCritic.cost_weight should NOT be too high or robot jitters
    # in narrow corridors — keep at 4.0 for "soft" deflection, use
    # critical_weight: 20.0 for near-collision spike behavior.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05               # 1 / controller_frequency = 1/20 (exact, no FP ε)
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0                  # diff-drive — Go2 nieholonomiczny
      wz_std: 0.4
      vx_max: 0.4                  # Go2 floor 0.2; cap 0.4 for safety
      vx_min: 0.0                  # no reversing
      vy_max: 0.0                  # diff-drive — explicit for parsers
      wz_max: 1.5
      ax_max: 3.0
      ay_max: 3.0
      az_max: 3.5
      iteration_count: 1
      prune_distance: 1.7
      # Sprint 2 Phase 0 (post-review): 1.5 → 0.3
      # 1.5s was 15× Nav2 default (0.1s) and far above Macenski's "<0.5s
      # max safe for noisy TF" guidance — meant MPPI could be planning
      # trajectories on odom from 1.5s ago = guaranteed collision in narrow
      # corridor.
      #
      # TRADEOFF (review #6): WebRTC TF jitter observed empirically at
      # 200-700ms. With transform_tolerance: 0.3, ~700ms-stale TF will
      # cause MPPI to refuse the cycle ("could not transform map→base_link")
      # → controller starvation visible in /diagnostics. This is INTENTIONAL
      # diagnostic behavior — better to skip a cycle than collide.
      # If Phase D shows excessive starvation: try 0.5 (Macenski max safe)
      # or fix WebRTC TF latency at source (driver-level).
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      # Sprint 2 Phase D Prep / 2026-05-09 Stage A finding (empirical on
      # real Go2 + Nav2 Humble 1.1.20 M1 native):
      # `publish_critic_scores` and `publish_optimal_trajectory` were Iron+
      # additions — NOT in Humble 1.1.20 binary (`ros2 param list` confirms
      # absent in /controller_server). YAML setting them = silently ignored.
      #
      # Workaround: enable `visualize: true` to publish /trajectories
      # (visualization_msgs/MarkerArray with sampled MPPI trajectories per
      # cycle). Phase D rosbag records /trajectories instead of the missing
      # critic_scores topic. Rejection rate inferred from sample distribution
      # (TrajectoryVisualizer.trajectory_step controls density) + cmd_vel
      # patterns + controller_server log parsing.
      visualize: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0           # KEEP LOW — high values cause jitter in narrow corridor (Macenski Tuning Guide)
        critical_weight: 20.0      # Near-collision spike — sharp cost rise <10cm from wall
        consider_footprint: true
        collision_cost: 10000.0
        collision_margin_distance: 0.10
        near_goal_distance: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0          # Lower than current main default (14.0) — lets MPPI deflect from /plan when obstacles block it (note: old docs said 32.0 — Macenski lowered to 14 in Aug 2024)
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      # 5 Hz is the minimum for reactive obstacle avoidance — at 0.5 m/s the
      # robot advances 10 cm per update, acceptable reaction distance for
      # pedestrians / pets. 1 Hz was a dead-man's switch (50 cm lag).
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # B: Rectangular footprint instead of circle. Go2 is 30×65cm; circular
      # robot_radius=0.20 (=40cm circle) ignored orientation → controller
      # planned through 60cm doorway as if robot were 40cm circle. With
      # rectangle, costmap knows robot orientation: 17cm half-width on
      # short side fits 60cm doorway with 13cm each side clearance.
      # Format: [[+x,+y],[+x,-y],[-x,-y],[-x,+y]] in base_link frame.
      footprint: "[[0.33, 0.17], [0.33, -0.17], [-0.33, -0.17], [-0.33, 0.17]]"
      # ULTRATHINK fix #2: re-enable voxel_layer. Local needs runtime
      # obstacles for safety. Issue earlier was static_layer:/map_clean
      # mismatch (cleaned map had shifted walls vs AMCL pose) — fixed below
      # by pointing local static to /map (raw).
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # CRITICAL fix: local uses RAW map (/map). AMCL localizes against raw
        # map; controller's local costmap MUST agree with AMCL's mental model.
        # Earlier we used /map_clean which had shifted walls (expand_free)
        # → DWB simulating from AMCL pose saw lethal cells where there
        # shouldn't be → all 819 trajectories rejected. Keep local on raw /map
        # so live scan, AMCL, and static wall geometry all agree.
        map_topic: /map
        map_subscribe_transient_local: True

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        observation_sources: scan
        # Footprint area always clears to free — kills the "Starting point
        # in lethal space" class of errors at source. The robot can never
        # be "in a wall" from its own perspective.
        footprint_clearing_enabled: true
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          # CRITICAL: 0.25 m skip-zone around the lidar so Go2's own body
          # reflections (legs / head seen by the head-mounted sensor)
          # don't mark cells right under the footprint as obstacles.
          raytrace_min_range: 0.25
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Sprint 2 fix: 0.05 → 0.20. Inflation layer provides the soft cost
        # gradient that lets the controller naturally prefer center-of-corridor
        # without any custom logic. With 0.05 there was effectively no
        # gradient — controller had to make hard accept/reject decisions at
        # the wall edge, which the previous custom pure-pursuit hard-stopped
        # via "scan blocked" predicate. With MPPI controller (Sprint 2 Phase C)
        # the gradient drives soft trajectory deflection: ObstaclesCritic
        # samples thousands of trajectories and prefers low-cost ones, so a
        # ~0.20m inflation gives 7-tier exponential cost falloff.
        # 80cm door - 34cm footprint = 23cm clearance/side; 0.20m inflation
        # creates a gradient through that whole corridor space, peak at wall.
        cost_scaling_factor: 3.0
        inflation_radius: 0.20

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      # Global costmap lives in the map frame — static_layer subscribes
      # to /map from nav2_map_server. Requires AMCL publishing map→odom.
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      resolution: 0.05
      # Sprint 2 fix: False → True. Inconsistency with planner's
      # allow_unknown=true on line ~384 — costmap was treating NO_INFORMATION
      # as FREE (passable) while planner was told it could plan through
      # unknown. Now both layers agree: costmap distinguishes UNKNOWN
      # cells, planner is permitted to traverse them. Crucial near doorways
      # where /scan can produce small UNKNOWN patches at frame edges.
      track_unknown_space: True
      static_map: True
      width: 500
      height: 500
      origin_x: -250.0 
      origin_y: -250.0
      # Circle model instead of rectangle — a quadruped yaws freely about
      # base_link, so re-checking corners at every heading makes Nav2
      # brittle in doorways. 0.34 m ≈ half-diagonal of 0.30×0.65 footprint
      # minus a sliver (doorways are 75 cm so 2×0.34=0.68 leaves 3.5 cm
      # clearance each side — tight but passable).
      footprint: "[[0.33, 0.17], [0.33, -0.17], [-0.33, -0.17], [-0.33, 0.17]]"   # match local rectangular
      # Removed voxel_layer from global_costmap. Reasoning:
      # - global_costmap is for path PLANNING (long-horizon, static features).
      # - local_costmap (with voxel_layer + /scan) handles RUNTIME obstacle
      #   avoidance in a 6m rolling window — that's where dynamic obstacles
      #   matter for the controller.
      # - With voxel_layer in global, every /scan reading gets DOUBLE-marked
      #   (once via static_layer's transient_local map, once via voxel_layer's
      #   live scan), creating spurious lethal cells around the robot that
      #   blocked SmacPlanner2D from finding paths. Removing the duplication
      #   restored planning.
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # User test #19 conclusion: cleaned map's expand_free_into_unknown=0.30m
        # widened doorways BEYOND real wall positions. Planner planned path
        # through "fake" door spot, robot's /scan saw real walls there →
        # collision. Reverting global to raw /map (single-map): doorways are
        # at real positions, planner has accurate geometry. Trade-off: raw
        # map has speckle that may complicate planning, but real-wall
        # accuracy beats fake-door corridors.
        map_topic: /map
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Plan-only test 2026-05-04: with inflation_radius=0.05 and smoothing
        # enabled, Smac produced a nominally legal path with only 0.14 m raw-map
        # centerline clearance near (0.75, -1.26). Go2 half-width is ~0.17 m,
        # so that plan physically scrapes walls. 0.22 m keeps a 5 cm margin
        # over half-width while still fitting through 70 cm doors when centered.
        cost_scaling_factor: 2.0
        inflation_radius: 0.22

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    # Real robot, no /clock publisher — planner must use wall clock or it
    # stalls forever waiting for ticks that never arrive.
    use_sim_time: False

    GridBased:
      # SmacPlanner2D: pure grid A*, ignores kinematic constraints.
      # The previous SmacPlannerHybrid with motion_model=REEDS_SHEPP was
      # designed for Ackermann-style cars that cannot turn in place —
      # combined with minimum_turning_radius=0.30m it refused to produce
      # plans in our ~75 cm indoor doorways, leaving bt_navigator stuck
      # in "spin as recovery" loops. Go2 is a quadruped that rotates
      # freely about base_link, so pure grid A* is both simpler and
      # strictly more permissive.
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.3                            # reach goal within 30 cm — good enough for home navigation
      downsample_costmap: false
      downsampling_factor: 1
      # Allow planning through unknown space. Go2's voxel window is only
      # 6.4 m wide; any goal further than that sits in "unknown" from
      # our perspective, and we need the planner to route through it
      # rather than refuse.
      # Sprint 1B Test 2 (raw map bez auto-clean): raw mapy mają unknown
      # cells dokładnie przy framugach drzwi — bez allow_unknown=true planner
      # odmawia planowania ścieżki przez te przejścia. Default false → blocking.
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      # Treat inflated raw-map costs as important. Low values allowed shorter
      # routes that hugged walls; plan-only clearance gate requires >=0.22 m.
      cost_travel_multiplier: 8.0
      # Smac smoothing can cut corners after A*, reducing wall clearance. Keep
      # grid path geometry for the external pure-pursuit controller.
      smooth_path: False
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
    
lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # Sprint 2 fix: re-enable controller_server, smoother_server,
    # velocity_smoother. Previously disabled because custom_controller.py
    # (DimOS pure-pursuit) replaced them — Sprint 2 swaps to Nav2 standard
    # MPPI Controller (configured in controller_server FollowPath section)
    # which works through narrow doorways out of the box per Macenski 2024.
    # With controller_server back in lifecycle, the standard Nav2 BT
    # recovery subtree (Spin / BackUp / ClearCostmap / Wait) finally works
    # because behavior_server has a controller to bond with.
    node_names: ["controller_server", "smoother_server", "planner_server", "behavior_server", "bt_navigator", "waypoint_follower", "velocity_smoother"]
    bond_timeout: 0.0

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    # Behaviors operate in map frame so recovery (backup, spin) reasons
    # about the localized pose, not raw odom (which drifts over a session).
    global_frame: map
    robot_base_frame: base_link
    # Bumped 0.1 → 1.5 (matches controller_server) — Go2 WebRTC TF latency.
    transform_tolerance: 1.5
    # Real robot, no /clock publisher — same story as planner_server above.
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# Sprint 2 Phase C: standard Nav2 path smoother (smooths /plan output
# from SmacPlanner2D before it reaches MPPI controller). Replaces the
# off-by-default smoother in planner_server's GridBased section.
# Standard Nav2 defaults — no Go2-specific tuning needed.
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# Sprint 2 Phase C: standard Nav2 cmd_vel rate-limiter. Sits in parallel
# with /cmd_vel (subscribes /cmd_vel from MPPI, publishes /cmd_vel_smoothed).
# Driver currently listens directly to /cmd_vel — Sprint 3 will wire the
# full chain (controller→smoother→collision_monitor→/cmd_vel) via launch
# file remaps. For Phase C, velocity_smoother runs as monitoring-only
# (publishes /cmd_vel_smoothed, driver ignores) so lifecycle can activate it.
# Tuning: max_velocity / max_accel matched to Go2 firmware capability.
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 2.5]
    min_velocity: [-0.5, 0.0, -2.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

